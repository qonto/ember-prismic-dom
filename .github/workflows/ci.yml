name: CI

on:
  push:
    branches:
      - main
      - "v*"
  pull_request:

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.12.3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: wyvox/action-setup-pnpm@v3
        with:
          pnpm-version: "${{ env.PNPM_VERSION }}"
          node-version: "${{ env.NODE_VERSION }}"
          args: "--frozen-lockfile"
      - name: Lint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      matrix:
        os: [ubuntu-latest]
        browser: [chrome]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: wyvox/action-setup-pnpm@v3
        with:
          pnpm-version: "${{ env.PNPM_VERSION }}"
          node-version: "${{ env.NODE_VERSION }}"
          args: "--frozen-lockfile"
      - name: Run Tests
        run: pnpm test:ember --launch ${{ matrix.browser }}
        working-directory: test-app

  # Known, currently unfixed upstream limitation (not masked with allow-failure,
  # intentionally left red so it stays visible): this addon's `element.hbs` uses the
  # `ensure-safe-component` helper to support passing a custom component as a string, which
  # relies on @embroider/util's ensureSafeComponent. That API targets Ember's legacy renderer
  # internals removed in Ember >= 6.8, and under Vite's build it fails to resolve at build time
  # entirely rather than only at runtime for the specific test that already deliberately skips
  # it. Since this job floats to the latest unpinned dependency versions, it's the one most
  # likely to surface this. See the skipped test in
  # test-app/tests/integration/components/prismic/dom-test.ts for more context.
  floating-dependencies:
    name: Floating Dependencies
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      matrix:
        os: [ubuntu-latest]
        browser: [chrome]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: wyvox/action-setup-pnpm@v3
        with:
          pnpm-version: "${{ env.PNPM_VERSION }}"
          node-version: "${{ env.NODE_VERSION }}"
          args: "--no-lockfile"
      - name: Run tests
        run: pnpm test:ember
        working-directory: test-app

  try-scenarios:
    name: Tests - ${{ matrix.ember-try-scenario }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    needs: test

    strategy:
      # fail-fast: false so one scenario's failure doesn't cancel the other scenarios
      # before they report real results.
      fail-fast: false
      matrix:
        ember-try-scenario:
          - ember-lts-5.12
          - ember-lts-6.8
          - ember-lts-6.12
          - ember-release
          - ember-beta
          - embroider-vite

        allow-failure: [false]
        include:
          - ember-try-scenario: ember-canary
            allow-failure: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: wyvox/action-setup-pnpm@v3
        with:
          pnpm-version: "${{ env.PNPM_VERSION }}"
          node-version: "${{ env.NODE_VERSION }}"
          args: "--frozen-lockfile"
      - name: Run tests
        run: pnpm ember try:one ${{ matrix.ember-try-scenario }} --skip-cleanup
        working-directory: test-app

  typescript-compatibility:
    name: Type checking - ${{ matrix.typescript-scenario }}
    runs-on: ubuntu-latest

    needs: [test]

    strategy:
      fail-fast: false
      matrix:
        typescript-scenario:
          - typescript@6.0
          - typescript@next

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: wyvox/action-setup-pnpm@v3
        with:
          pnpm-version: "${{ env.PNPM_VERSION }}"
          node-version: "${{ env.NODE_VERSION }}"
          args: "--frozen-lockfile"
      - name: Update TS version on addon package
        run: pnpm add -D ${{ matrix.typescript-scenario }}
        working-directory: ember-prismic-dom
      - name: Update TS version on test-app package
        run: pnpm add -D ${{ matrix.typescript-scenario }}
        working-directory: test-app
      - name: Type checking
        run: pnpm lint:types
